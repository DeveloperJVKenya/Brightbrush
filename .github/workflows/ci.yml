# Static analysis, every test suite (Flutter, Cloud Functions, Firestore
# security rules on the emulator) and a web build. Runs on pull requests and
# on pushes to other branches; pushes to main run it once, inside the
# Deploy workflow, where a red run blocks the deploy.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

concurrency:
  # github.workflow is "Deploy" when called from there, so the two never
  # cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze, test, build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --wasm --release
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

  functions:
    name: Cloud Functions build + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --test "lib/**/*.test.js"

  rules:
    name: Firestore rules tests (emulator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rules_tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rules_tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools
      - run: npm ci
      - run: npm test
