# Deploys after CI passes.
#
#   push to main       → the web app goes to the "staging" preview channel
#                        (a private URL, bright-brush--staging-xxxx.web.app,
#                        expires after 30 days). Functions and rules are not
#                        touched, so nothing customers use changes.
#   Run workflow →     → full production release: functions, then the web
#   target: production   app, then Firestore/Storage rules and indexes.
#
# One-time setup (README → Release process): add the repository secret
# FIREBASE_SERVICE_ACCOUNT_PROD with a JSON key for a service account with
# Firebase Admin, Cloud Functions Admin, Service Account User, Cloud
# Scheduler Admin and Artifact Registry Writer. Until it exists this
# workflow skips the deploy steps.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'staging' }}
    env:
      TARGET: ${{ github.event.inputs.target || 'staging' }}
      SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
      FUNCTIONS_DISCOVERY_TIMEOUT: 120
    steps:
      - uses: actions/checkout@v5
      - name: Check credentials
        id: gate
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_PROD is not set - skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          fi
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.gate.outputs.skip != 'true'
        run: npm install -g firebase-tools

      - name: Staging preview
        if: steps.gate.outputs.skip != 'true' && env.TARGET == 'staging'
        run: firebase hosting:channel:deploy staging --expires 30d --project production --non-interactive

      - name: Install functions dependencies
        if: steps.gate.outputs.skip != 'true' && env.TARGET == 'production'
        working-directory: functions
        run: npm ci
      # Order matters: functions first (the new app may call new callables),
      # then the app, then rules/indexes.
      - if: steps.gate.outputs.skip != 'true' && env.TARGET == 'production'
        run: firebase deploy --project production --only functions --non-interactive --force
      - if: steps.gate.outputs.skip != 'true' && env.TARGET == 'production'
        run: firebase deploy --project production --only hosting --non-interactive
      - if: steps.gate.outputs.skip != 'true' && env.TARGET == 'production'
        run: firebase deploy --project production --only firestore,storage --non-interactive
